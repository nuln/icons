<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Icons — Edge Asset Hub</title>
  <!-- 高质感矢量网格 Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='128'%20fill='%23111418'/%3E%3Crect%20x='96'%20y='96'%20width='136'%20height='136'%20rx='32'%20fill='%2338bdf8'/%3E%3Crect%20x='280'%20y='96'%20width='136'%20height='136'%20rx='32'%20fill='%23ffffff'/%3E%3Crect%20x='96'%20y='280'%20width='136'%20height='136'%20rx='32'%20fill='%23818cf8'/%3E%3Crect%20x='280'%20y='280'%20width='136'%20height='136'%20rx='32'%20fill='%2338bdf8'%20opacity='0.8'/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
/* ============================================================
   Nuln Workers / Tower 风格规范 — 全宽流式 Charcoal Slate 极简纯净设计
   ============================================================ */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  
  --bg-canvas: #f4f6f8;
  --bg-surface: #ffffff;
  --bg-subtle: #f1f3f5;
  --bg-hover: #e9ecef;
  --bg-active: #dee2e6;
  
  --border-subtle: #edf0f2;
  --border-base: #e2e5e9;
  --border-strong: #c8cdd4;
  
  --text-primary: #111418;
  --text-secondary: #505967;
  --text-tertiary: #8a93a0;
  
  --primary: #181b20;
  --primary-hover: #000000;
  --primary-light: #f1f3f5;
  --primary-ring: rgba(17, 20, 24, 0.12);
  
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --success: #15803d;
  --success-bg: #f0fdf4;
  --success-border: #bbf7d0;
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --danger: #b91c1c;
  --danger-bg: #fef2f2;
  --info: #0284c7;
  --info-bg: #f0f9ff;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-full: 9999px;
  
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 24px 48px -12px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06);

  --checker-color-1: #e9ecef;
  --checker-color-2: #dee2e6;
}

[data-theme="dark"] {
  --bg-canvas: #090c10;
  --bg-surface: #0f141c;
  --bg-subtle: #161b24;
  --bg-hover: #1f2633;
  --bg-active: #293242;
  
  --border-subtle: #1a202c;
  --border-base: #242c3d;
  --border-strong: #364259;
  
  --text-primary: #f0f6fc;
  --text-secondary: #919eab;
  --text-tertiary: #637381;
  
  --primary: #f0f6fc;
  --primary-hover: #ffffff;
  --primary-light: rgba(255, 255, 255, 0.08);
  --primary-ring: rgba(255, 255, 255, 0.15);

  --success-bg: rgba(21, 128, 61, 0.15);
  --success-border: rgba(34, 197, 94, 0.25);
  --warning-bg: rgba(180, 83, 9, 0.15);
  --danger-bg: rgba(185, 28, 28, 0.15);
  --info-bg: rgba(2, 132, 199, 0.15);
  --purple-bg: rgba(124, 58, 237, 0.15);
  
  --shadow-modal: 0 24px 48px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);

  --checker-color-1: #1f2633;
  --checker-color-2: #161b24;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-primary);
  background-color: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= 顶部主导航栏 (Navbar) ================= */
.app-navbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-base);
  box-shadow: var(--shadow-xs);
  width: 100%;
}

.navbar-container {
  width: 100%;
  height: 52px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 9px;
  user-select: none;
  cursor: pointer;
}

/* 精致图标库专属 Logo：圆角徽标 + 4 象限几何图形 */
.brand-icon {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: var(--bg-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-xs);
}
.brand-icon svg {
  width: 15px;
  height: 15px;
  stroke: var(--bg-surface);
}

.brand-title {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}
.path-pill {
  font-size: 10.5px;
  font-family: var(--font-mono);
  background: var(--bg-subtle);
  border: 1px solid var(--border-base);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
}

/* 顶栏紧凑数据胶囊 */
.nav-stats-pills {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 500;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.stat-pill b {
  color: var(--text-primary);
  font-weight: 600;
}
.stat-pill.green { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
.stat-pill.purple { background: var(--purple-bg); color: var(--purple); border-color: rgba(124,58,237,0.2); }
.stat-pill.blue { background: var(--accent-light); color: var(--accent); border-color: rgba(37,99,235,0.2); }

@media (max-width: 860px) {
  .nav-stats-pills { display: none; }
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 5px 10px;
  font-size: 12px;
  width: 220px;
  color: var(--text-primary);
  transition: all 0.2s;
}
.search-box:focus-within {
  border-color: var(--border-strong);
  background: var(--bg-surface);
  box-shadow: 0 0 0 2px var(--primary-ring);
  width: 260px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  color: inherit;
  font-size: 12px;
}
.search-box kbd {
  font-size: 9.5px;
  font-family: var(--font-mono);
  background: var(--bg-surface);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-xs);
  padding: 1px 4px;
  color: var(--text-tertiary);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-base);
  background: var(--bg-surface);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-strong);
}
.btn-primary {
  background: var(--primary);
  color: var(--bg-surface);
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.icon-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-base);
  background: var(--bg-surface);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

/* ================= 主布局全宽流式容器 ================= */
.main-wrapper {
  flex: 1;
  width: 100%;
  padding: 14px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* 过滤与视图控制工具栏 (全宽流式) */
.filter-tabs-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--bg-surface);
  padding: 6px 12px;
  border: 1px solid var(--border-base);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xs);
  width: 100%;
}
.domain-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.domain-tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s ease;
}
.domain-tab:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}
.domain-tab.active {
  background: var(--primary-light);
  color: var(--text-primary);
  font-weight: 600;
  border-color: var(--border-base);
}
.tab-badge {
  display: inline-block;
  min-width: 15px;
  padding: 0 4px;
  font-size: 9.5px;
  font-weight: 600;
  line-height: 14px;
  text-align: center;
  color: var(--text-tertiary);
  background: var(--bg-active);
  border-radius: 6px;
}

.view-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.control-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  font-size: 11px;
  color: var(--text-secondary);
}
.bg-opt {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  border: 1px solid var(--border-strong);
  cursor: pointer;
}
.bg-opt.checker {
  background: repeating-conic-gradient(var(--checker-color-1) 0% 25%, var(--checker-color-2) 0% 50%) 50% / 6px 6px;
}
.bg-opt.dark { background: #090c10; }
.bg-opt.light { background: #ffffff; }

.size-select {
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 11px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
}

/* ================= 极简大图标卡片矩阵 ================= */
.icon-matrix {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
  gap: 10px;
  width: 100%;
}

.icon-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  position: relative;
  height: 104px;
}
.icon-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

/* 图标展示舞台：撑满整个卡片 100% 高度 */
.card-stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.2s;
}
.card-stage.mode-checker {
  background: repeating-conic-gradient(var(--checker-color-1) 0% 25%, var(--checker-color-2) 0% 50%) 50% / 8px 8px;
}
.card-stage.mode-dark { background: #090c10; }
.card-stage.mode-light { background: #ffffff; }

/* 图标饱满居中，至少占用卡片 70% 比例 */
.card-stage img {
  width: 60px;
  height: 60px;
  max-width: 72%;
  max-height: 72%;
  object-fit: contain;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.icon-card:hover .card-stage img {
  transform: scale(1.15) translateY(-2px);
}

/* 标签样式 */
.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 5px;
  border-radius: var(--radius-xs);
  font-size: 9.5px;
  font-weight: 500;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  white-space: nowrap;
}
.tag-badge.purple { background: var(--purple-bg); color: var(--purple); border-color: rgba(124,58,237,0.2); }
.tag-badge.blue { background: var(--accent-light); color: var(--accent); border-color: rgba(37,99,235,0.2); }

/* 右上角格式标签（svg / png）：常态保持显示 */
.badge-tag-pos {
  position: absolute;
  top: 5px;
  right: 5px;
  font-size: 8.5px;
  padding: 0 4px;
  line-height: 14px;
  z-index: 2;
}

/* 左上角分类标签（apps / devtools 等）：默认隐藏，hover 时显示 */
.cat-tag-pos {
  position: absolute;
  top: 5px;
  left: 5px;
  font-size: 8.5px;
  padding: 0 4px;
  line-height: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
  z-index: 2;
}
.icon-card:hover .cat-tag-pos {
  opacity: 1;
}

/* 悬浮在图标底部的文件名胶囊（不再有独立白边，悬浮磨砂质感） */
.icon-overlay-name {
  position: absolute;
  bottom: 5px;
  left: 6px;
  right: 6px;
  background: rgba(15, 20, 28, 0.85);
  backdrop-filter: blur(6px);
  color: #f0f6fc;
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  border: 1px solid rgba(255, 255, 255, 0.1);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity 0.15s ease, transform 0.15s ease;
  pointer-events: none;
  z-index: 3;
}
[data-theme="light"] .icon-overlay-name {
  background: rgba(255, 255, 255, 0.92);
  color: #111418;
  border: 1px solid rgba(0, 0, 0, 0.1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.icon-card:hover .icon-overlay-name {
  opacity: 1;
  transform: translateY(0);
}

/* ================= 模态弹窗 ================= */
.modal-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-lg);
  width: 520px;
  max-width: 94vw;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  animation: modalIn 0.15s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}

.modal-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close-btn {
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  border-radius: var(--radius-xs);
}
.modal-close-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-preview-box {
  height: 170px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-base);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.modal-preview-box img {
  width: 96px;
  height: 96px;
  max-height: 120px;
  max-width: 120px;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
  transition: transform 0.2s ease;
}
.modal-preview-box img:hover {
  transform: scale(1.08);
}

.code-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.code-field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
.code-field-input-group {
  display: flex;
  gap: 6px;
}
.code-field-input {
  flex: 1;
  background: var(--bg-subtle);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 11.5px;
  font-family: var(--font-mono);
  color: var(--text-primary);
  outline: none;
}
.code-field-input:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 2px var(--primary-ring);
  background: var(--bg-surface);
}

/* ================= 浮动 Toast 通知 ================= */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2000;
}
.toast {
  background: var(--primary);
  color: var(--bg-surface);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-size: 12px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 6px;
  animation: toastIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.empty-view {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
  font-size: 12.5px;
}
  </style>
</head>
<body>

  <!-- ================= 顶部主导航栏 ================= -->
  <header class="app-navbar">
    <div class="navbar-container">
      <div class="nav-left">
        <div class="brand-section" onclick="selectCategory('all')">
          <!-- 符合图标/矢量库美学的几何四象限微徽标 -->
          <span class="brand-icon" title="Icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="14" width="7" height="7" rx="2"></rect>
              <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            </svg>
          </span>
          <span class="brand-title">Icons</span>
        </div>

        <!-- 顶栏紧凑数据胶囊 -->
        <div class="nav-stats-pills">
          <div class="stat-pill green"><span>总图标:</span> <b id="stat-total">0</b></div>
          <div class="stat-pill blue"><span>分类:</span> <b id="stat-cats">0</b></div>
          <div class="stat-pill purple"><span>SVG 矢量:</span> <b id="stat-svg">0</b></div>
        </div>
      </div>

      <div class="nav-right">
        <div class="search-box">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="搜索图标 / 分类..." />
          <kbd>/</kbd>
        </div>

        <button class="icon-btn" title="切换暗黑/浅色主题" onclick="toggleTheme()">
          <svg id="theme-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= 主内容容器 ================= -->
  <main class="main-wrapper">

    <!-- 顶部横向分类标签条与视图控制工具栏 -->
    <div class="filter-tabs-row">
      <div class="domain-tabs" id="domain-tabs">
        <!-- 动态生成胶囊分类按钮 -->
      </div>

      <div class="view-controls">
        <div class="control-pill">
          <span>格式:</span>
          <select class="size-select" id="format-select" onchange="setFormatFilter(this.value)">
            <option value="all" selected>全部</option>
            <option value="svg">SVG</option>
            <option value="png">PNG</option>
          </select>
        </div>

        <div class="control-pill">
          <span>底色:</span>
          <div class="bg-opt checker" onclick="setBgMode('mode-checker')" title="棋盘网格"></div>
          <div class="bg-opt dark" onclick="setBgMode('mode-dark')" title="深黑底色"></div>
          <div class="bg-opt light" onclick="setBgMode('mode-light')" title="纯白底色"></div>
        </div>

        <div class="control-pill">
          <span>尺寸:</span>
          <select class="size-select" id="size-select" onchange="setIconSize(this.value)">
            <option value="42">42px</option>
            <option value="50">50px</option>
            <option value="58" selected>58px (默认)</option>
            <option value="66">66px</option>
            <option value="74">74px</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 纯粹精炼的图标矩阵网格 -->
    <div class="icon-matrix" id="icon-matrix">
      <div class="empty-view">正在载入图标库...</div>
    </div>

  </main>

  <!-- ================= 详情 Modal 弹窗 ================= -->
  <div class="modal-backdrop" id="detail-modal" onclick="handleBackdropClick(event)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span id="modal-icon-name">图标详情</span>
        </div>
        <button class="modal-close-btn" onclick="closeModal()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-preview-box mode-checker" id="modal-preview-box">
          <img id="modal-img" src="" alt="preview" />
        </div>

        <div class="code-field">
          <div class="code-field-label">直链 URL (CDN Link)</div>
          <div class="code-field-input-group">
            <input type="text" class="code-field-input" id="field-url" readonly />
            <button class="btn btn-sm" onclick="copyFromField('field-url', '直链 URL')">复制</button>
          </div>
        </div>

        <div class="code-field" id="field-svg-box">
          <div class="code-field-label">SVG 内联源码 (Raw SVG)</div>
          <div class="code-field-input-group">
            <input type="text" class="code-field-input" id="field-svg" readonly />
            <button class="btn btn-sm" onclick="copyFromField('field-svg', 'SVG 代码')">复制</button>
          </div>
        </div>

        <div class="code-field">
          <div class="code-field-label">HTML &lt;img&gt; 标签</div>
          <div class="code-field-input-group">
            <input type="text" class="code-field-input" id="field-html" readonly />
            <button class="btn btn-sm" onclick="copyFromField('field-html', 'HTML 代码')">复制</button>
          </div>
        </div>

        <div class="code-field">
          <div class="code-field-label">Markdown 语法</div>
          <div class="code-field-input-group">
            <input type="text" class="code-field-input" id="field-md" readonly />
            <button class="btn btn-sm" onclick="copyFromField('field-md', 'Markdown')">复制</button>
          </div>
        </div>

        <div class="code-field">
          <div class="code-field-label">CSS background-image</div>
          <div class="code-field-input-group">
            <input type="text" class="code-field-input" id="field-css" readonly />
            <button class="btn btn-sm" onclick="copyFromField('field-css', 'CSS 样式')">复制</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    let rawSub = window.location.pathname;
    if (rawSub.split('/').pop().includes('.')) {
      rawSub = rawSub.replace(/\/[^/]*\.[^/]+$/, '/');
    }
    if (!rawSub.endsWith('/')) rawSub += '/';
    const currentSubpath = rawSub;
    const baseUrl = `${window.location.origin}${currentSubpath}`;

    function initTheme() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      showToast(`已切换为 ${next === 'dark' ? '深色' : '浅色'} 模式`);
    }
    initTheme();

    let iconData = { icons: [], categories: {} };
    let selectedCat = 'all';
    let selectedFormat = 'all';
    let filterQuery = '';
    let currentBgMode = 'mode-checker';
    let currentSize = 58;

    function setFormatFilter(fmt) {
      selectedFormat = fmt;
      renderIcons();
    }

    async function fetchIcons() {
      try {
        const res = await fetch('./icons.json');
        if (!res.ok) throw new Error('Failed to load icons.json');
        iconData = await res.json();
        
        renderStats();
        renderTabs();
        renderIcons();
      } catch (err) {
        document.getElementById('icon-matrix').innerHTML = `
          <div class="empty-view">
            <p>未找到 icons.json 或索引未建立</p>
            <p style="margin-top:6px;font-size:11.5px;">请在 public/icons 放入文件并运行 npm run build</p>
          </div>
        `;
      }
    }

    function renderStats() {
      const total = iconData.total || 0;
      const cats = Object.keys(iconData.categories || {}).length;
      const svgCount = (iconData.icons || []).filter(i => i.isSvg).length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-cats').textContent = cats;
      document.getElementById('stat-svg').textContent = svgCount;
    }

    function renderTabs() {
      const catList = Object.entries(iconData.categories || {});
      const tabContainer = document.getElementById('domain-tabs');
      
      let tabsHtml = `
        <button class="domain-tab ${selectedCat === 'all' ? 'active' : ''}" onclick="selectCategory('all')">
          全部 <span class="tab-badge">${iconData.total || 0}</span>
        </button>
      `;
      for (const [cat, count] of catList) {
        tabsHtml += `
          <button class="domain-tab ${selectedCat === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
            ${cat} <span class="tab-badge">${count}</span>
          </button>
        `;
      }
      tabContainer.innerHTML = tabsHtml;
    }

    function selectCategory(cat) {
      selectedCat = cat;
      renderTabs();
      renderIcons();
    }

    function setBgMode(mode) {
      currentBgMode = mode;
      document.querySelectorAll('.card-stage').forEach(stage => {
        stage.className = `card-stage ${mode}`;
      });
      document.getElementById('modal-preview-box').className = `modal-preview-box ${mode}`;
    }

    function setIconSize(size) {
      currentSize = size;
      document.querySelectorAll('.card-stage img').forEach(img => {
        img.style.width = `${size}px`;
        img.style.height = `${size}px`;
      });
    }

    function renderIcons() {
      const container = document.getElementById('icon-matrix');
      const queryWords = filterQuery ? filterQuery.split(/\s+/).filter(Boolean) : [];

      const filtered = (iconData.icons || []).filter(icon => {
        const matchCat = selectedCat === 'all' || icon.category === selectedCat;
        if (!matchCat) return false;

        const matchFormat = selectedFormat === 'all' || icon.ext.toLowerCase() === selectedFormat;
        if (!matchFormat) return false;

        if (queryWords.length === 0) return true;

        const targetText = (icon.searchTags || `${icon.name} ${icon.category} ${icon.title}`).toLowerCase();
        // 多词全匹配（例如搜索 "苹果" 或 "设置 齿轮" 均能命中）
        return queryWords.every(word => targetText.includes(word));
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-view">未检索到符合条件的图标资产</div>';
        return;
      }

      container.innerHTML = filtered.map(icon => {
        const encoded = encodeURIComponent(JSON.stringify(icon));
        return `
          <div class="icon-card" onclick="openModal('${encoded}')" title="点击查看详情与复制代码: ${icon.name}">
            <div class="card-stage ${currentBgMode}">
              <span class="tag-badge cat-tag-pos">${icon.category}</span>
              <span class="tag-badge badge-tag-pos ${icon.isSvg ? 'purple' : 'blue'}">${icon.ext}</span>
              <img src="${icon.relativePath}" style="width:${currentSize}px;height:${currentSize}px;" alt="${icon.name}" loading="lazy" />
              <div class="icon-overlay-name">${icon.name}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(encoded) {
      const icon = JSON.parse(decodeURIComponent(encoded));
      const fullUrl = new URL(icon.relativePath, baseUrl).href;

      document.getElementById('modal-icon-name').textContent = `${icon.name} — ${icon.category}`;
      document.getElementById('modal-img').src = icon.relativePath;
      document.getElementById('field-url').value = fullUrl;
      document.getElementById('field-html').value = `<img src="${fullUrl}" alt="${icon.title}" width="24" height="24" />`;
      document.getElementById('field-md').value = `![${icon.title}](${fullUrl})`;
      document.getElementById('field-css').value = `background-image: url('${fullUrl}');`;

      const svgBox = document.getElementById('field-svg-box');
      if (icon.isSvg && icon.svgContent) {
        svgBox.style.display = 'flex';
        document.getElementById('field-svg').value = icon.svgContent;
      } else {
        svgBox.style.display = 'none';
      }

      document.getElementById('detail-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'detail-modal') closeModal();
    }

    function copySnippet(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制 ${label}`);
      }).catch(() => {
        showToast('复制失败，请手动选择复制');
      });
    }

    function copyFromField(fieldId, label) {
      const val = document.getElementById(fieldId).value;
      copySnippet(val, label);
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>${msg}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s';
        setTimeout(() => toast.remove(), 200);
      }, 2000);
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      filterQuery = e.target.value.toLowerCase().trim();
      renderIcons();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    fetchIcons();
  </script>
</body>
</html>
